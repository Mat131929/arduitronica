<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Arduitronic</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo"><h2>Arduitronic</h2></div>
        <nav>
            <ul>
                <li><a href="index.html">Catálogo</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="ubicacion.html">Ubicación</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="section-title">Tu Pedido</h1>
        <div class="cart-list">
            <div id="lista-carrito">
                <!-- Se llena mediante JavaScript -->
            </div>
            <h2 style="text-align: right; margin-top: 2rem; color: #0056b3;">
                Subtotal: $<span id="subtotal">0.00</span> MXN
            </h2>
            
            <!-- Sección de pago por WhatsApp -->
            <div style="margin-top: 2rem; background: var(--secondary-color); padding: 1.5rem; border-radius: 8px;">
                <h3>Completar Pedido</h3>
                <input type="text" id="nombreCliente" placeholder="Ingresa tu nombre y/o matrícula" style="width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                <button onclick="procesarPagoPorWhatsApp()" style="background-color: #25D366; font-size: 1.1rem;">
                    Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>Arduitronic - Todos los derechos reservados.</p>
        <p style="font-size: 0.8rem; color: #aaa;">Desarrollado por DigiWeb Solutions - Ingeniería en Tecnologías de la Información (UPSLP)</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
